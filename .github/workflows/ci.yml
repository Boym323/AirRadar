name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Changelog backfill tests inspect dates and commit ranges for release tags.
          fetch-depth: 0
          # Keep tags explicit: the changelog test resolves historical release tags.
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production:browser

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy the tested commit
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          : "${PRODUCTION_HOST:?Missing PRODUCTION_HOST repository/environment secret}"
          : "${PRODUCTION_USER:?Missing PRODUCTION_USER repository/environment secret}"
          : "${PRODUCTION_SSH_KEY:?Missing PRODUCTION_SSH_KEY repository/environment secret}"
          : "${PRODUCTION_KNOWN_HOSTS:?Missing PRODUCTION_KNOWN_HOSTS repository/environment secret}"
          : "${EXPECTED_COMMIT:?Missing GitHub commit SHA}"

          install -d -m 700 "${HOME}/.ssh"
          key_file="${HOME}/.ssh/airradar-production"
          known_hosts_file="${HOME}/.ssh/known_hosts"
          umask 077
          printf '%s\n' "${PRODUCTION_SSH_KEY}" > "${key_file}"
          printf '%s\n' "${PRODUCTION_KNOWN_HOSTS}" > "${known_hosts_file}"

          ssh_args=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -i "${key_file}"
          )
          if [[ -n "${PRODUCTION_SSH_PORT:-}" ]]; then
            ssh_args+=( -p "${PRODUCTION_SSH_PORT}" )
          fi

          ssh "${ssh_args[@]}" "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "sudo -n /var/www/airradar/deploy/release.sh --branch main --automated --commit ${EXPECTED_COMMIT}"
