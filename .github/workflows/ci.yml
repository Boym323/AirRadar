name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # A maintainer can opt into a full deploy-free rehearsal via the release-preview label.
    types: [opened, synchronize, reopened, labeled]
    # The metadata bot already validates these exact generated files through
    # a separately dispatched CI run before merging. A second pull_request
    # workflow has no eligible jobs and can finish red after auto-delete.
    # Mixed metadata + application changes still trigger normal PR validation.
    paths-ignore:
      - CHANGELOG.md
      - docs/metrics/code-history.json
      - docs/metrics/code-growth.svg
  workflow_dispatch:

concurrency:
  # Never let a newer docs-only push replace a queued deploy-bearing main run.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || format('main-sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  validate:
    # Metadata PRs are validated by the explicit workflow_dispatch run started
    # by repository-metadata.yml. Skipping the duplicate pull_request job keeps
    # its auto-merge from deleting the branch while that event is still queued.
    # release-preview already executes full unit/typecheck, the production
    # browser suite and performance gates. Avoid repeating the fast PR job;
    # release-tests must retain lint, dependency and static quality checks.
    if: (github.event_name == 'pull_request' && github.head_ref != 'automation/repository-metadata' && !contains(github.event.pull_request.labels.*.name, 'release-preview')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/repository-metadata')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Changelog backfill tests inspect dates and commit ranges for release tags.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Detect pull request scope
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}")"
          scope_json="$(git diff --name-only -z "${base}" HEAD | node scripts/release-scope.mjs --stdin0)"
          code="$(RELEASE_SCOPE_JSON="${scope_json}" node -e 'process.stdout.write(String(JSON.parse(process.env.RELEASE_SCOPE_JSON).deploy))')"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          if [[ "${code}" == 'true' ]]; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docs_only=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          critical="$(git diff --name-only -z "${base}" HEAD | node scripts/ci-critical-scope.mjs --stdin0)"
          echo "critical=${critical}" >> "${GITHUB_OUTPUT}"
          # V6 acceptance is scoped by code changes, not a special branch name.
          changed_paths="$(git diff --name-only "${base}" HEAD)"
          if grep -Eq '^(lib/radar/(licensed-aircraft-glb-v6|aircraft-3d[^/]*)\.ts|lib/aviation-media[^/]*\.ts|components/(airport-media-links|radar/radar-3d[^/]*)\.tsx?|scripts/v6-media-acceptance\.mjs|tests/(licensed-aircraft-glb-v6|v6-media-acceptance)\.test\.[cm]?[jt]s)$' <<< "${changed_paths}"; then
            echo "v6_browser=true" >> "${GITHUB_OUTPUT}"
          else
            echo "v6_browser=false" >> "${GITHUB_OUTPUT}"
          fi
          if grep -Eq '^(lib/radar/licensed-aircraft-glb-v6\.ts|tests/licensed-aircraft-glb-v6\.test\.ts)$' <<< "${changed_paths}"; then
            echo "v6_assets=true" >> "${GITHUB_OUTPUT}"
          else
            echo "v6_assets=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "PR scope: ${scope_json}"
      - name: Validate documentation-only change
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          node scripts/docs-localization.mjs
          node scripts/changelog.mjs check
      - name: Verify release gate planner
        if: steps.scope.outputs.docs_only != 'true'
        run: node --check scripts/production-gates.mjs && node --check scripts/ci-pr-validation-reuse.mjs && node --test tests/ci-release-plan.test.mjs tests/ci-browser-concurrency.test.mjs tests/ci-timing-report.test.mjs tests/ci-deploy-safety.test.mjs tests/ci-pr-validation-reuse.test.mjs tests/reconcile-manual-native-release-tags.test.mjs tests/t58-stall-canary.test.mjs
      - run: npm ci --prefer-offline --no-audit --no-fund
        if: steps.scope.outputs.docs_only != 'true'
      - name: Audit production dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm audit --omit=dev --audit-level=high
      - name: Restore ESLint cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}
      - name: Restore Next compiler cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-
      - run: npm run prisma:generate
        if: steps.scope.outputs.docs_only != 'true'
      - name: Verify Prisma migration integrity
        if: steps.scope.outputs.docs_only != 'true'
        run: npx prisma migration check
      - name: Verify feature registry
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run features:check
      - name: Verify Czech documentation localization
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run docs:check
      - name: Verify visual system budget
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run visual:check
      - name: Audit aircraft icon geometry
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run icons:audit
      - name: Run lint, typecheck, and Vitest in parallel
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        env:
          AIRRADAR_TEST_BASE_SHA: ${{ steps.scope.outputs.base }}
        run: |
          set -Eeuo pipefail
          lint_status=0
          typecheck_status=0
          test_status=0
          npm run lint & lint_pid=$!
          npm run typecheck:prepared & typecheck_pid=$!
          echo "Testing changed files since ${AIRRADAR_TEST_BASE_SHA}"
          npm run test:changed & test_pid=$!
          wait "$lint_pid" || lint_status=$?
          wait "$typecheck_pid" || typecheck_status=$?
          wait "$test_pid" || test_status=$?
          if (( lint_status != 0 || typecheck_status != 0 || test_status != 0 )); then
            echo "Parallel validation failed (lint=$lint_status typecheck=$typecheck_status test=$test_status)"
            exit 1
          fi
      - name: Profile history-payload CPU and allocations (synthetic; no DB)
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        env:
          JITI_TSCONFIG_PATHS: 'true'
        run: node --expose-gc node_modules/jiti/lib/jiti-cli.mjs scripts/benchmark-history-payload.ts
      - run: npm run build:prepared
        if: steps.scope.outputs.docs_only != 'true'
        env:
          AIRRADAR_SKIP_BUILD_TYPECHECK: '1'
      - name: PR critical runtime smoke
        if: github.event_name == 'pull_request' && steps.scope.outputs.critical == 'true'
        run: npm run test:production -- --core
      - name: Verify pinned CC BY Airbus/Boeing GLB sources
        if: github.event_name == 'pull_request' && steps.scope.outputs.v6_assets == 'true'
        env:
          RUN_LIVE_GLB_ASSET_AUDIT: "1"
        run: npm run test:targeted -- tests/licensed-aircraft-glb-v6.test.ts
      # GPU paths need a real browser in addition to typecheck/Vitest/core smoke.
      - name: Install Chromium for V6 3D browser QA
        if: github.event_name == 'pull_request' && steps.scope.outputs.v6_browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: V6 3D desktop/mobile browser gate
        if: github.event_name == 'pull_request' && steps.scope.outputs.v6_browser == 'true'
        env:
          AIRRADAR_VISUAL_TARGETS: radar-v6-d-3d-terrain,radar-v6-d-3d-mobile,radar-v6-g-presentation,airport-v6-h-authorized-media
          AIRRADAR_V6_ASSET_QA: "1"
        run: npm run test:production:browser
      - name: Upload V6 3D visual evidence
        if: always() && github.event_name == 'pull_request' && steps.scope.outputs.v6_browser == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: v6-3d-browser-${{ github.sha }}
          path: |
            artifacts/visual-smoke/radar-v6-*.png
            artifacts/visual-smoke/radar-v6-*-gpu.json
            artifacts/visual-smoke/airport-v6-media-embed-*.png
          if-no-files-found: ignore
          retention-days: 3

  reconcile-manual-native-tags:
    name: Reconcile manually deployed native release tags
    # After the manually deployed native 1.0.476/1.0.477 builds, no Git tags
    # were published. This bounded, main-only one-time repair runs before any
    # tag-dependent validation, version resolution or deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Restore only verified missing native release tag refs
        run: node scripts/reconcile-manual-native-release-tags.mjs

  release-scope:
    name: Release scope
    needs: [reconcile-manual-native-tags]
    if: >-
      ${{ always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.reconcile-manual-native-tags.result == 'success') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview'))
      ) }}
    runs-on: ubuntu-24.04
    # Read-only verification of the exact-tree PR preview against GitHub.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
      browser: ${{ steps.scope.outputs.browser }}
      visual_targets: ${{ steps.quick.outputs.visual_targets || steps.scope.outputs.visual_targets }}
      viewports: ${{ steps.quick.outputs.viewports || steps.scope.outputs.viewports }}
      performance_scenarios: ${{ steps.quick.outputs.performance_scenarios || steps.scope.outputs.performance_scenarios }}
      validated_preview: ${{ steps.preview.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Evaluate every commit in a push, not just the immediate parent.
          fetch-depth: 0
      # PR previews intentionally use unknown-scope fallback (all gates). There is
      # no privileged runner or deploy job for pull_request events.
      - name: Detect release-required changes and gate plan
        id: scope
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          changes="$(mktemp)"
          trap 'rm -f -- "$changes"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] \
              && git cat-file -e "$PR_BASE_SHA^{commit}" \
              && git merge-base --is-ancestor "$PR_BASE_SHA" HEAD; then
              git diff --name-only -z "$PR_BASE_SHA" HEAD > "$changes"
            else
              printf '%s\0' '__unknown_change__' > "$changes"
              echo "::warning::Cannot verify PR base: selecting full release gates"
            fi
          elif [[ "$PUSH_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "$PUSH_BEFORE" =~ ^0{40}$ ]] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" \
            && git merge-base --is-ancestor "$PUSH_BEFORE" "$GITHUB_SHA"; then
            git diff --name-only -z "$PUSH_BEFORE" "$GITHUB_SHA" > "$changes"
          else
            printf '%s\0' '__unknown_change__' > "$changes"
            echo "::warning::Cannot verify push base: selecting full release gates"
          fi
          scope_json="$(node scripts/release-scope.mjs --stdin0 < "$changes")"
          plan_json="$(node scripts/ci-release-plan.mjs --stdin0 < "$changes")"
          deploy="$(RELEASE_SCOPE_JSON="$scope_json" node -e 'process.stdout.write(String(JSON.parse(process.env.RELEASE_SCOPE_JSON).deploy))')"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          for field in browser visualTargets viewports performanceScenarios; do
            value="$(RELEASE_PLAN_JSON="$plan_json" RELEASE_PLAN_FIELD="$field" node -e 'process.stdout.write(String(JSON.parse(process.env.RELEASE_PLAN_JSON)[process.env.RELEASE_PLAN_FIELD]))')"
            case "$field" in
              visualTargets) field_out="visual_targets" ;;
              performanceScenarios) field_out="performance_scenarios" ;;
              *) field_out="$field" ;;
            esac
            echo "$field_out=$value" >> "$GITHUB_OUTPUT"
          done
          echo "Release scope: $scope_json"
          echo "Release gates: $plan_json"
      - name: Verify completed PR preview for identical main tree
        id: preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scope.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-pr-validation-reuse.mjs
      - name: Retain smoke gates but reuse verified release-preview coverage
        id: quick
        if: steps.preview.outputs.reuse == 'true'
        run: |
          set -Eeuo pipefail
          # The PR built/tested exactly this source tree. Still run all main
          # release identity, typecheck, core, smoke and deployment gates.
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { planReleaseGates } from "./scripts/ci-release-plan.mjs";
          const fast = planReleaseGates(["app/api/version/route.ts"]);
          if (fast.browser !== "fast" || fast.performance !== "fast") throw new Error("fast smoke plan is not valid");
          for (const [key, value] of [
            ["visual_targets", fast.visualTargets],
            ["viewports", fast.viewports],
            ["performance_scenarios", fast.performanceScenarios],
          ]) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          NODE
          echo "Verified preview: main performs smoke checks instead of repeating the full visual/performance matrices"

  release-validate:
    name: Release validation
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview')) && needs.release-scope.outputs.deploy == 'true'
    needs: release-scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags are required by changelog/release validation.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve release build metadata
        id: release-meta
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node scripts/version.mjs resolve-release-version --channel stable)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "build_time=$(date --utc --iso-8601=seconds)" >> "${GITHUB_OUTPUT}"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Restore Next compiler cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-
      - run: npm run prisma:generate
      - run: npm run build:prepared
        env:
          AIRRADAR_SKIP_BUILD_TYPECHECK: '1'
          AIRRADAR_VERSION: ${{ steps.release-meta.outputs.version }}
          AIRRADAR_TAG: ${{ steps.release-meta.outputs.tag }}
          AIRRADAR_COMMIT: ${{ github.sha }}
          AIRRADAR_CHANNEL: production
          AIRRADAR_BUILD_TIME: ${{ steps.release-meta.outputs.build_time }}
      - name: Prepare standalone runtime assets
        run: node scripts/prepare-standalone.mjs .next
      - name: Package production build artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-meta.outputs.version }}
          RELEASE_BUILD_TIME: ${{ steps.release-meta.outputs.build_time }}
        run: |
          set -Eeuo pipefail
          artifact_root="artifacts/production-build"
          rm -rf -- "${artifact_root}"
          mkdir -p -- "${artifact_root}"
          mkdir -p -- "${artifact_root}/.next"
          cp -a -- .next/BUILD_ID "${artifact_root}/.next/BUILD_ID"
          cp -a -- .next/standalone "${artifact_root}/.next/standalone"
          node - "${artifact_root}/manifest.json" "${GITHUB_SHA}" "${RELEASE_VERSION}" "${RELEASE_BUILD_TIME}" <<'NODE'
          const fs = require("node:fs");
          const [manifestPath, commit, version, buildTime] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync("generated/build-version.json", "utf8"));
          const standaloneMetadata = JSON.parse(fs.readFileSync(".next/standalone/generated/build-version.json", "utf8"));
          const buildId = fs.readFileSync(".next/BUILD_ID", "utf8").trim();
          if (metadata.commit !== commit || metadata.version !== version || metadata.channel !== "production") {
            throw new Error("Root build metadata does not match the CI release identity");
          }
          if (standaloneMetadata.commit !== commit || standaloneMetadata.version !== version ||
              standaloneMetadata.channel !== metadata.channel ||
              standaloneMetadata.buildTime !== metadata.buildTime) {
            throw new Error("Standalone build metadata does not match the CI release identity");
          }
          const manifest = {
            schemaVersion: 1,
            runtime: "standalone-v1",
            commit,
            version,
            channel: "production",
            buildTime: metadata.buildTime || buildTime,
            buildId,
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          NODE
      - name: Upload production build artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-build-${{ github.sha }}
          path: artifacts/production-build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # package-lock contains the exact installed Playwright version.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Prepare Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Production core and browser gates
        env:
          AIRRADAR_VISUAL_TARGETS: ${{ needs.release-scope.outputs.visual_targets }}
          PRODUCTION_GATE_BROWSER_VIEWPORTS: ${{ needs.release-scope.outputs.viewports }}
          # Full browser matrix is GPU-heavy: three workers produced two
          # distinct timeout failures on main (#867/#869) and an intermittent
          # pass on retry. Keep visual captures at the proven two-worker limit
          # while retaining three independent viewport workers.
          AIRRADAR_VISUAL_CONCURRENCY: '2'
          AIRRADAR_VIEWPORT_CONCURRENCY: '3'
        run: npm run test:production:all
      - name: Upload visual system artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-system-${{ github.sha }}
          path: |
            artifacts/visual-system-audit.json
            artifacts/aircraft-icon-audit.json
            artifacts/visual-smoke/*.png
          if-no-files-found: ignore

  release-tests:
    name: Release tests and typecheck
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview')) && needs.release-scope.outputs.deploy == 'true'
    needs: release-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run prisma:generate
      - name: Verify Prisma migration integrity
        run: npx prisma migration check
      # Keep these gates authoritative for release-preview PRs even though the
      # duplicate fast validate job is skipped.
      - name: Run static quality gates
        run: |
          npm run lint
          npm run features:check
          npm run docs:check
          npm run visual:check
          npm run icons:audit
          npm run changelog:check
      - name: Verify release gate planner
        run: node --check scripts/production-gates.mjs && node --check scripts/ci-pr-validation-reuse.mjs && node --test tests/ci-release-plan.test.mjs tests/ci-browser-concurrency.test.mjs tests/ci-timing-report.test.mjs tests/ci-deploy-safety.test.mjs tests/ci-pr-validation-reuse.test.mjs
      - name: Run release typecheck and verified-preview-aware Vitest
        shell: bash
        env:
          AIRRADAR_VALIDATED_PREVIEW: ${{ needs.release-scope.outputs.validated_preview }}
        run: |
          set -Eeuo pipefail
          typecheck_status=0
          test_status=0
          npm run typecheck:prepared & typecheck_pid=$!
          if [[ "$AIRRADAR_VALIDATED_PREVIEW" == "true" ]]; then
            # Exact code tree + four green release-preview jobs + CodeQL were
            # checked on GitHub. Retain targeted runtime regression smoke.
            npm run test:targeted -- tests/aircraft-state.test.ts tests/route-cache-inflight-timeout.test.ts tests/sse-capacity.test.ts & test_pid=$!
          else
            npm run test:full & test_pid=$!
          fi
          wait "$typecheck_pid" || typecheck_status=$?
          wait "$test_pid" || test_status=$?
          if (( typecheck_status != 0 || test_status != 0 )); then
            echo "Release validation failed (typecheck=$typecheck_status test=$test_status)"
            exit 1
          fi

  release-performance:
    name: Release performance regression
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preview')) && needs.release-scope.outputs.deploy == 'true'
    needs: release-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Restore Next compiler cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: perf-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            perf-next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-
            next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-
      - name: Build performance fixture
        run: npm run build:prepared
        env:
          AIRRADAR_SKIP_BUILD_TYPECHECK: '1'
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Prepare Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Radar production performance baseline
        shell: bash
        env:
          RADAR_PERF_SCENARIOS: ${{ needs.release-scope.outputs.performance_scenarios }}
        run: |
          set -Eeuo pipefail
          benchmark_status=0
          npm run benchmark:radar || benchmark_status=$?
          if [[ -f artifacts/radar-performance-baseline.md ]]; then
            cat artifacts/radar-performance-baseline.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${benchmark_status}"
      - name: Upload radar performance baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radar-performance-baseline-${{ github.sha }}
          path: |
            artifacts/radar-performance-baseline.json
            artifacts/radar-performance-baseline.md
          if-no-files-found: ignore


  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-scope.outputs.deploy == 'true'
    needs: [release-scope, release-validate, release-tests, release-performance]
    # Only deploy-bearing runs enter this queue; docs-only changes cannot cancel them.
    concurrency:
      group: airradar-production-deploy
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - name: Clear previous validated production build
        run: rm -rf -- /tmp/airradar-ci-production-build
      - name: Download validated production build
        uses: actions/download-artifact@v8
        with:
          name: production-build-${{ github.sha }}
          path: /tmp/airradar-ci-production-build
      - name: Verify production ATS routes before release
        run: |
          set -Eeuo pipefail
          ats_tmp="$(mktemp)"
          trap 'rm -f "${ats_tmp}"' EXIT
          if ! curl -fsS https://airradar.pomykal.cz/api/ats/routes -o "${ats_tmp}"; then
            echo "[deploy] Existing production ATS routes are unavailable; continuing so this release can recover them."
            exit 0
          fi
          node - "${ats_tmp}" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const counts = payload.counts;
          if (payload.available !== true) throw new Error("Production ATS routes are unavailable");
          if (!counts || !Number.isInteger(counts.routes) || counts.routes <= 0 || !Number.isInteger(counts.points) || counts.points <= 0 || !Number.isInteger(counts.segments) || counts.segments <= 0) {
            throw new Error(`Invalid production ATS counts: ${JSON.stringify(counts)}`);
          }
          if (!Array.isArray(payload.routes) || payload.routes.length !== counts.routes) {
            throw new Error("Production ATS route count does not match the route payload");
          }
          if (typeof payload.source?.effectiveDate !== "string" || payload.source.effectiveDate.length === 0) {
            throw new Error("Production ATS source is missing an effective date");
          }
          for (const route of payload.routes) {
            for (const segment of route.segments ?? []) {
              if (segment.availabilityStatus !== "UNKNOWN") {
                throw new Error(`Unexpected ATS availability status on ${route.designator}/${segment.id}: ${segment.availabilityStatus}`);
              }
            }
          }
          console.log(`[deploy] ATS routes OK effective=${payload.source.effectiveDate} routes=${counts.routes} points=${counts.points} segments=${counts.segments}`);
          NODE

      - name: Detect legacy release bootstrap
        id: release-bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          release_script="/var/www/airradar/deploy/release.sh"
          [[ -r "${release_script}" ]] || {
            echo "::error::Production release script is not readable: ${release_script}"
            exit 1
          }

          branch_sha_line="$(grep -nF 'remote_sha="$(git_cmd rev-parse FETCH_HEAD)"' "${release_script}" | head -n 1 | cut -d: -f1 || true)"
          tag_fetch_line="$(grep -nE 'git_cmd fetch --force( --prune --prune-tags)? --tags origin' "${release_script}" | head -n 1 | cut -d: -f1 || true)"

          if [[ -n "${branch_sha_line}" && -n "${tag_fetch_line}" ]] && (( branch_sha_line < tag_fetch_line )); then
            echo "legacy=false" >> "${GITHUB_OUTPUT}"
            echo "[deploy] production release script already preserves the branch SHA before tag fetch"
          else
            echo "legacy=true" >> "${GITHUB_OUTPUT}"
            echo "[deploy] legacy release script detected; enabling one-shot validated-SHA bootstrap tag"
          fi

      - name: Create legacy validated-SHA bootstrap tag
        id: legacy-bootstrap-tag
        if: steps.release-bootstrap.outputs.legacy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="0000000000-airradar-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ref="refs/tags/${tag}"
          payload="$(printf '{"ref":"%s","sha":"%s"}' "${ref}" "${GITHUB_SHA}")"

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "${payload}" >/dev/null

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "[deploy] temporary bootstrap tag ${tag} pins legacy FETCH_HEAD to ${GITHUB_SHA}"

      - name: Deploy the tested commit locally
        run: |
          set -Eeuo pipefail
          # A manual release may briefly hold the release flock; never remove or bypass it.
          # Retry only that explicit contention, not validation/rollback failures.
          for attempt in 1 2 3 4 5; do
            output="$(mktemp)"
            if sudo -n /var/www/airradar/deploy/release.sh \
                --branch main \
                --automated \
                --commit "${GITHUB_SHA}" 2>&1 | tee "${output}"; then
              # Stream release progress while retaining an exact diagnostic copy.
              rm -f -- "${output}"
              exit 0
            else
              result=$?
            fi
            # Output has already been streamed by tee; reuse the saved copy only
            # for targeted release-lock retry detection.
            if grep -Fq 'Another AirRadar release is already running.' "${output}" && (( attempt < 5 )); then
              rm -f -- "${output}"
              echo "::warning::Another AirRadar release holds the lock (attempt ${attempt}/5); retrying after 30 seconds."
              sleep 30
            else
              rm -f -- "${output}"
              exit "${result}"
            fi
          done

      - name: Remove legacy validated-SHA bootstrap tag
        if: always() && steps.legacy-bootstrap-tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TAG: ${{ steps.legacy-bootstrap-tag.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if ! curl -fsS \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/${BOOTSTRAP_TAG}"; then
            echo "::warning::Could not delete temporary bootstrap tag ${BOOTSTRAP_TAG}; it is non-versioned and can be removed later."
          else
            echo "[deploy] temporary bootstrap tag removed: ${BOOTSTRAP_TAG}"
          fi

      - name: Verify deployed release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_version="$(node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("/tmp/airradar-ci-production-build/manifest.json","utf8")); process.stdout.write(m.version)')"
          expected_commit="${GITHUB_SHA:0:8}"
          version_tmp="$(mktemp)"
          trap 'rm -f "${version_tmp}"' EXIT
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors https://airradar.pomykal.cz/api/version -o "${version_tmp}"
          node - "${version_tmp}" "${expected_version}" "${expected_commit}" <<'NODE'
          const fs = require("node:fs");
          const [path, expectedVersion, expectedCommit] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          if (payload.version !== expectedVersion) {
            throw new Error(`Production version mismatch: expected ${expectedVersion}, got ${payload.version}`);
          }
          if (payload.commit !== expectedCommit) {
            throw new Error(`Production commit mismatch: expected ${expectedCommit}, got ${payload.commit}`);
          }
          if (payload.channel !== "production") {
            throw new Error(`Production channel mismatch: expected production, got ${payload.channel}`);
          }
          if (typeof payload.buildTime !== "string" || !Number.isFinite(Date.parse(payload.buildTime))) {
            throw new Error(`Production build time is invalid: ${payload.buildTime}`);
          }
          console.log(`[deploy] release identity OK version=${payload.version} commit=${payload.commit}`);
          NODE

      - name: Create GitHub release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_version="$(node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("/tmp/airradar-ci-production-build/manifest.json","utf8")); process.stdout.write(m.version)')"
          release_target="$(node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync("/tmp/airradar-ci-production-build/manifest.json","utf8")); process.stdout.write(m.commit)')"
          release_tag="v${release_version}"
          RELEASE_TAG="${release_tag}" RELEASE_TARGET="${release_target}" node /var/www/airradar/scripts/create-github-release.mjs

      - name: Verify production ATS routes after release
        run: |
          set -Eeuo pipefail
          ats_tmp="$(mktemp)"
          trap 'rm -f "${ats_tmp}"' EXIT
          curl -fsS https://airradar.pomykal.cz/api/ats/routes -o "${ats_tmp}"
          node - "${ats_tmp}" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const counts = payload.counts;
          if (payload.available !== true) throw new Error("Production ATS routes are unavailable after release");
          if (!counts || !Number.isInteger(counts.routes) || counts.routes <= 0 || !Number.isInteger(counts.points) || counts.points <= 0 || !Number.isInteger(counts.segments) || counts.segments <= 0) {
            throw new Error(`Invalid production ATS counts after release: ${JSON.stringify(counts)}`);
          }
          if (!Array.isArray(payload.routes) || payload.routes.length !== counts.routes) {
            throw new Error("Production ATS route count does not match the route payload after release");
          }
          if (typeof payload.source?.effectiveDate !== "string" || payload.source.effectiveDate.length === 0) {
            throw new Error("Production ATS source is missing an effective date after release");
          }
          for (const route of payload.routes) {
            for (const segment of route.segments ?? []) {
              if (segment.availabilityStatus !== "UNKNOWN") {
                throw new Error(`Unexpected ATS availability status after release on ${route.designator}/${segment.id}: ${segment.availabilityStatus}`);
              }
            }
          }
          console.log(`[deploy] ATS routes remain healthy effective=${payload.source.effectiveDate} routes=${counts.routes} points=${counts.points} segments=${counts.segments}`);
          NODE
