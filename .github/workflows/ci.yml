name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Changelog backfill tests inspect dates and commit ranges for release tags.
          fetch-depth: 0
          # Keep tags explicit: the changelog test resolves historical release tags.
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production:browser

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy the tested commit locally
        run: |
          set -Eeuo pipefail
          sudo -n /var/www/airradar/deploy/release.sh \
            --branch main \
            --automated \
            --commit "${GITHUB_SHA}"
