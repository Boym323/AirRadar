name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Changelog backfill tests inspect dates and commit ranges for release tags.
          fetch-depth: 0
          # Keep tags explicit: the changelog test resolves historical release tags.
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}
      - name: Restore Next compiler cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}-
      - run: npm run prisma:generate
      - name: Run lint, typecheck, and Vitest in parallel
        shell: bash
        run: |
          set -Eeuo pipefail
          lint_status=0
          typecheck_status=0
          test_status=0
          npm run lint & lint_pid=$!
          npm run typecheck:prepared & typecheck_pid=$!
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            npm run test:full & test_pid=$!
          else
            export AIRRADAR_TEST_BASE_SHA="$(git merge-base HEAD "origin/${GITHUB_BASE_REF:-main}")"
            echo "Testing changed files since ${AIRRADAR_TEST_BASE_SHA}"
            npm run test:changed & test_pid=$!
          fi
          wait "$lint_pid" || lint_status=$?
          wait "$typecheck_pid" || typecheck_status=$?
          wait "$test_pid" || test_status=$?
          if (( lint_status != 0 || typecheck_status != 0 || test_status != 0 )); then
            echo "Parallel validation failed (lint=$lint_status typecheck=$typecheck_status test=$test_status)"
            exit 1
          fi
      - run: npm run build:prepared
        env:
          AIRRADAR_SKIP_BUILD_TYPECHECK: '1'
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # package-lock contains the exact installed Playwright version.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Prepare Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Production core and browser gates
        run: npm run test:production:all
      - name: Radar production performance baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          benchmark_status=0
          npm run benchmark:radar || benchmark_status=$?
          if [[ -f artifacts/radar-performance-baseline.md ]]; then
            cat artifacts/radar-performance-baseline.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${benchmark_status}"
      - name: Upload radar performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-performance-baseline-${{ github.sha }}
          path: |
            artifacts/radar-performance-baseline.json
            artifacts/radar-performance-baseline.md
          if-no-files-found: ignore

  release-scope:
    name: Release scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect changelog-only merge
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -z "${parent}" ]]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "${parent}" "${GITHUB_SHA}")
          deploy=false
          for file in "${changed_files[@]}"; do
            if [[ "${file}" != "CHANGELOG.md" ]]; then
              deploy=true
              break
            fi
          done
          echo "deploy=${deploy}" >> "${GITHUB_OUTPUT}"
          echo "Release required: ${deploy}"

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-scope.outputs.deploy == 'true'
    needs: [validate, release-scope]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    steps:
      - name: Verify production ATS routes before release
        run: |
          set -Eeuo pipefail
          ats_tmp="$(mktemp)"
          trap 'rm -f "${ats_tmp}"' EXIT
          curl -fsS https://airradar.pomykal.cz/api/ats/routes -o "${ats_tmp}"
          node - "${ats_tmp}" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const counts = payload.counts;
          if (payload.available !== true) throw new Error("Production ATS routes are unavailable");
          if (!counts || !Number.isInteger(counts.routes) || counts.routes <= 0 || !Number.isInteger(counts.points) || counts.points <= 0 || !Number.isInteger(counts.segments) || counts.segments <= 0) {
            throw new Error(`Invalid production ATS counts: ${JSON.stringify(counts)}`);
          }
          if (!Array.isArray(payload.routes) || payload.routes.length !== counts.routes) {
            throw new Error("Production ATS route count does not match the route payload");
          }
          if (typeof payload.source?.effectiveDate !== "string" || payload.source.effectiveDate.length === 0) {
            throw new Error("Production ATS source is missing an effective date");
          }
          for (const route of payload.routes) {
            for (const segment of route.segments ?? []) {
              if (segment.availabilityStatus !== "UNKNOWN") {
                throw new Error(`Unexpected ATS availability status on ${route.designator}/${segment.id}: ${segment.availabilityStatus}`);
              }
            }
          }
          console.log(`[deploy] ATS routes OK effective=${payload.source.effectiveDate} routes=${counts.routes} points=${counts.points} segments=${counts.segments}`);
          NODE

      - name: Deploy the tested commit locally
        run: |
          set -Eeuo pipefail
          sudo -n /var/www/airradar/deploy/release.sh \
            --branch main \
            --automated \
            --commit "${GITHUB_SHA}"

      - name: Verify deployed release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_version="$(node /var/www/airradar/scripts/version.mjs resolve-release-version --channel stable)"
          expected_commit="${GITHUB_SHA:0:8}"
          version_tmp="$(mktemp)"
          trap 'rm -f "${version_tmp}"' EXIT
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors https://airradar.pomykal.cz/api/version -o "${version_tmp}"
          node - "${version_tmp}" "${expected_version}" "${expected_commit}" <<'NODE'
          const fs = require("node:fs");
          const [path, expectedVersion, expectedCommit] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          if (payload.version !== expectedVersion) {
            throw new Error(`Production version mismatch: expected ${expectedVersion}, got ${payload.version}`);
          }
          if (payload.commit !== expectedCommit) {
            throw new Error(`Production commit mismatch: expected ${expectedCommit}, got ${payload.commit}`);
          }
          if (payload.channel !== "production") {
            throw new Error(`Production channel mismatch: expected production, got ${payload.channel}`);
          }
          if (typeof payload.buildTime !== "string" || !Number.isFinite(Date.parse(payload.buildTime))) {
            throw new Error(`Production build time is invalid: ${payload.buildTime}`);
          }
          console.log(`[deploy] release identity OK version=${payload.version} commit=${payload.commit}`);
          NODE

      - name: Create GitHub release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          release_version="$(node /var/www/airradar/scripts/version.mjs resolve-release-version --channel stable)"
          release_tag="v${release_version}"
          RELEASE_TAG="${release_tag}" node /var/www/airradar/scripts/create-github-release.mjs

      - name: Verify production ATS routes after release
        run: |
          set -Eeuo pipefail
          ats_tmp="$(mktemp)"
          trap 'rm -f "${ats_tmp}"' EXIT
          curl -fsS https://airradar.pomykal.cz/api/ats/routes -o "${ats_tmp}"
          node - "${ats_tmp}" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const counts = payload.counts;
          if (payload.available !== true) throw new Error("Production ATS routes are unavailable after release");
          if (!counts || !Number.isInteger(counts.routes) || counts.routes <= 0 || !Number.isInteger(counts.points) || counts.points <= 0 || !Number.isInteger(counts.segments) || counts.segments <= 0) {
            throw new Error(`Invalid production ATS counts after release: ${JSON.stringify(counts)}`);
          }
          if (!Array.isArray(payload.routes) || payload.routes.length !== counts.routes) {
            throw new Error("Production ATS route count does not match the route payload after release");
          }
          if (typeof payload.source?.effectiveDate !== "string" || payload.source.effectiveDate.length === 0) {
            throw new Error("Production ATS source is missing an effective date after release");
          }
          for (const route of payload.routes) {
            for (const segment of route.segments ?? []) {
              if (segment.availabilityStatus !== "UNKNOWN") {
                throw new Error(`Unexpected ATS availability status after release on ${route.designator}/${segment.id}: ${segment.availabilityStatus}`);
              }
            }
          }
          console.log(`[deploy] ATS routes remain healthy effective=${payload.source.effectiveDate} routes=${counts.routes} points=${counts.points} segments=${counts.segments}`);
          NODE

  sync-changelog:
    name: Sync release changelog
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --force --tags origin

      - name: Backfill and verify changelog
        run: |
          set -Eeuo pipefail
          node scripts/changelog.mjs backfill
          node scripts/changelog.mjs check

      - name: Open or refresh changelog PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already synchronized."
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          branch="automation/changelog-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add CHANGELOG.md
          git commit -m "docs: sync changelog through ${latest_tag:-latest-release}"
          git push --force origin "${branch}"

          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing_pr}" ]]; then
            echo "Updated changelog PR #${existing_pr}."
            exit 0
          fi

          if ! gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${branch}" \
            --title "docs: sync release changelog" \
            --body "Automated changelog backfill for published AirRadar releases. This PR updates only CHANGELOG.md; changelog-only merges are excluded from production deployment."; then
            echo "::warning::GitHub Actions cannot create pull requests. Changelog branch ${branch} was pushed successfully and can be opened as a PR manually."
            {
              echo "### Changelog sync branch ready"
              echo ""
              echo "The branch \`${branch}\` was updated, but repository settings do not allow GitHub Actions to create pull requests."
              echo "Open a PR from \`${branch}\` to \`main\` manually."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

