name: Codebase Growth Chart

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: code-growth-main
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Update history and SVG
        run: node docs/metrics/update-code-growth.mjs
      - name: Commit changed chart only
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(docs/metrics/code-history.json docs/metrics/code-growth.svg)
          if git diff --quiet -- "${files[@]}"; then
            echo "Chart is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "docs(metrics): update codebase growth [skip ci]"
          # GITHUB_TOKEN pushes do not trigger another GitHub Actions CI/deploy.
          git push origin HEAD:main
