name: Codebase metrics

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/metrics/code-history.json"
      - "docs/metrics/code-growth.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codebase-metrics-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update code metrics
        run: node scripts/code-metrics.mjs

      - name: Commit metrics
        shell: bash
        run: |
          if git diff --quiet -- docs/metrics/code-history.json docs/metrics/code-growth.svg; then
            echo "No code metrics change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/code-history.json docs/metrics/code-growth.svg
          git commit -m "chore(metrics): update codebase growth [skip ci]"
          git push origin HEAD:main
