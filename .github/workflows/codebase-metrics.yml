name: Codebase Metrics

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/metrics/code-history.json"
      - "docs/metrics/code-growth.svg"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codebase-metrics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update code metrics
        run: node scripts/code-metrics.mjs

      - name: Open or refresh metrics PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if git diff --quiet -- docs/metrics/code-history.json docs/metrics/code-growth.svg; then
            echo "Code metrics are already current."
            exit 0
          fi

          branch="automation/codebase-metrics"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add docs/metrics/code-history.json docs/metrics/code-growth.svg
          git commit -m "chore(metrics): update codebase growth"
          git push --force origin "${branch}"

          existing_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing_pr}" ]]; then
            echo "Updated codebase metrics PR #${existing_pr}."
            exit 0
          fi

          if ! gh pr create             --repo "${GITHUB_REPOSITORY}"             --base main             --head "${branch}"             --title "chore: update codebase growth metrics"             --body "Automated AirRadar LOC snapshot and README chart refresh. The metric counts non-empty physical source lines and separates production code from tests. Generated by the Codebase Metrics workflow; this PR does not bypass the normal main-branch review path."; then
            echo "::warning::GitHub Actions cannot create pull requests. Metrics branch ${branch} was pushed successfully and can be opened as a PR manually."
            {
              echo "### Codebase metrics branch ready"
              echo ""
              printf 'The branch `%s` was updated, but repository settings do not allow GitHub Actions to create pull requests.\\n' "${branch}"
              printf 'Open a PR from `%s` to `main` manually.\\n' "${branch}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
