name: Integration Health

on:
  workflow_dispatch:
  # Run the post-release audit only when this CI run actually deployed. CI
  # also completes successfully for docs-only changes that skip deployment.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Avoid scheduling skipped post-CI runs for every PR update.
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-health.yml"
  schedule:
    - cron: "19 */2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: airradar-integration-health
  cancel-in-progress: true

jobs:
  post-deploy:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    outputs:
      deployed: ${{ steps.release.outputs.deployed }}
    steps:
      - name: Check whether CI deployed production
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          deployed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Deploy production" and .conclusion == "success")] | length > 0')"
          echo "deployed=${deployed}" >> "$GITHUB_OUTPUT"

  health:
    needs: [post-deploy]
    if: ${{ always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && needs.post-deploy.outputs.deployed == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # This is an observational scheduled health report, not a production
      # readiness gate. Real DEGRADED/BLOCKED evidence remains in the artifact
      # and emits an Actions warning. Runtime/tool/security failures still fail.
      - name: Run bounded read-only integration audit (degradation warns)
        run: |
          mkdir -p "$RUNNER_TEMP/airradar-audit"
          node scripts/integration-audit.mjs \
            --mode readonly \
            --degraded-policy warn \
            --json "$RUNNER_TEMP/airradar-audit/report.json" \
            --markdown "$RUNNER_TEMP/airradar-audit/report.md"
          # The reporter exits 0 only when the report is successfully written.
          # Never copy an absent or incomplete artifact into the job summary.
          # Its Markdown is allowlisted/sanitized and size-bounded by the CLI.
          echo "## Integration audit" >> "$GITHUB_STEP_SUMMARY"
          cat -- "$RUNNER_TEMP/airradar-audit/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/airradar-audit/report.json
            ${{ runner.temp }}/airradar-audit/report.md
          if-no-files-found: warn
