name: Integration Health

on:
  workflow_dispatch:
  # The post-CI event occurs AFTER the standard production deployment job,
  # unlike a main-push probe that would inspect the previous release.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-health.yml"
      - "scripts/integration-health-report.mjs"
  schedule:
    - cron: "19 */2 * * *"

permissions:
  contents: read

concurrency:
  group: airradar-integration-health
  cancel-in-progress: true

jobs:
  health:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Inspect existing production counters (no external provider requests)
        run: node scripts/integration-health-report.mjs
