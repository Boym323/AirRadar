name: Generate Prisma 8 RC lockfile (temporary)
on:
  push:
    branches:
      - dependabot/npm_and_yarn/prisma-8.0.0-rc.26
    paths:
      - package.json
      - prisma/contract.prisma
      - .github/workflows/prisma-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Resolve matched Prisma CLI and PostgreSQL runtime dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile install and contract
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prisma:generate
      - name: Commit verified regenerated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/prisma-lock-refresh.yml
          git commit -m 'build(prisma): generate compatible RC lockfile and remove temporary workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"
