name: T58 Production Soak

on:
  workflow_dispatch:

run-name: "T58 read-only production soak #${{ github.run_number }}"

# One T58 at a time. A new dispatch must not interrupt an existing hour.
concurrency:
  group: airradar-t58-read-only-soak
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  chunk_1:
    name: Collect production T58 (chunk 1/7)
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/t58-soak-chunk.yml
    with: { chunk: 1, chunk_seconds: 540, previous_chunk: 0, expected_commit: "", finalize: false }
    secrets: inherit
  chunk_2:
    name: Collect production T58 (chunk 2/7)
    needs: chunk_1
    if: ${{ needs.chunk_1.result == 'success' }}
    uses: ./.github/workflows/t58-soak-chunk.yml
    with:
      chunk: 2
      chunk_seconds: 540
      previous_chunk: 1
      expected_commit: ${{ needs.chunk_1.outputs.deployed_sha }}
      finalize: false
    secrets: inherit
  chunk_3:
    name: Collect production T58 (chunk 3/7)
    needs: chunk_2
    if: ${{ needs.chunk_2.result == 'success' }}
    uses: ./.github/workflows/t58-soak-chunk.yml
    with:
      chunk: 3
      chunk_seconds: 540
      previous_chunk: 2
      expected_commit: ${{ needs.chunk_2.outputs.deployed_sha }}
      finalize: false
    secrets: inherit
  chunk_4:
    name: Collect production T58 (chunk 4/7)
    needs: chunk_3
    if: ${{ needs.chunk_3.result == 'success' }}
    uses: ./.github/workflows/t58-soak-chunk.yml
    with:
      chunk: 4
      chunk_seconds: 540
      previous_chunk: 3
      expected_commit: ${{ needs.chunk_3.outputs.deployed_sha }}
      finalize: false
    secrets: inherit
  chunk_5:
    name: Collect production T58 (chunk 5/7)
    needs: chunk_4
    if: ${{ needs.chunk_4.result == 'success' }}
    uses: ./.github/workflows/t58-soak-chunk.yml
    with:
      chunk: 5
      chunk_seconds: 540
      previous_chunk: 4
      expected_commit: ${{ needs.chunk_4.outputs.deployed_sha }}
      finalize: false
    secrets: inherit
  chunk_6:
    name: Collect production T58 (chunk 6/7)
    needs: chunk_5
    if: ${{ needs.chunk_5.result == 'success' }}
    uses: ./.github/workflows/t58-soak-chunk.yml
    with:
      chunk: 6
      chunk_seconds: 540
      previous_chunk: 5
      expected_commit: ${{ needs.chunk_5.outputs.deployed_sha }}
      finalize: false
    secrets: inherit
  chunk_7:
    name: Collect and analyze production T58 (chunk 7/7)
    needs: chunk_6
    if: ${{ needs.chunk_6.result == 'success' }}
    uses: ./.github/workflows/t58-soak-chunk.yml
    with:
      chunk: 7
      chunk_seconds: 540
      previous_chunk: 6
      expected_commit: ${{ needs.chunk_6.outputs.deployed_sha }}
      finalize: true
    secrets: inherit

  archive:
    name: Preserve report in isolated Git history
    needs: chunk_7
    if: ${{ always() && needs.chunk_7.outputs.report_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Download aggregate report artifact
        uses: actions/download-artifact@v8
        with:
          name: t58-sanitized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/t58-upload
      - name: Publish immutable run record off main
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/t58-report.mjs verify "$RUNNER_TEMP/t58-upload/soak.summary.json"
          archive_branch="audit/t58-history"
          stamp="$(date -u +%Y/%m/%d)"
          short_relative="$stamp/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          relative="reports/t58/$short_relative"
          if git ls-remote --exit-code --heads origin "refs/heads/$archive_branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$archive_branch"
            git switch --detach FETCH_HEAD
          else
            git switch --detach "$GITHUB_SHA"
          fi
          mkdir -p "$relative" reports/t58
          cp "$RUNNER_TEMP/t58-upload/soak.summary.json" "$relative/summary.json"
          cp "$RUNNER_TEMP/t58-upload/soak.summary.md" "$relative/summary.md"
          cp "$RUNNER_TEMP/t58-upload/comparison.md" "$relative/comparison.md"
          verdict="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).verdict)' "$relative/summary.json")"
          version="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version)' "$relative/summary.json")"
          index="reports/t58/INDEX.md"
          if [[ ! -f "$index" ]]; then
            printf '# AirRadar T58 production soak history\n\n' > "$index"
            printf 'Read-only production telemetry; sanitized aggregates only. No raw NDJSON, credentials or aircraft identities.\n\n' >> "$index"
            printf '| UTC archived | Run | Version | Verdict | Reports |\n| --- | --- | --- | --- | --- |\n' >> "$index"
          fi
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"
          printf '| %s | [#%s](https://github.com/%s/actions/runs/%s) | %s | %s | [summary](%s/summary.md) · [comparison](%s/comparison.md) · [JSON](%s/summary.json) |\n' \
            "$now" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$version" "$verdict" \
            "$short_relative" "$short_relative" "$short_relative" >> "$index"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$relative" "$index"
          git commit -m "chore(t58): archive read-only soak $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:refs/heads/$archive_branch"
          printf '\n**Permanent report archive:** https://github.com/%s/tree/%s/reports/t58\n' \
            "$GITHUB_REPOSITORY" "$archive_branch" >> "$GITHUB_STEP_SUMMARY"
