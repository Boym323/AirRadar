name: T58 v1.0.483 one-time read-only dispatch
run-name: "T58 v1.0.483: short then 60-minute soak"

on:
  push:
    branches:
      - diagnostics/t58-v1483-dispatch-once-20261016
    paths:
      - .github/workflows/t58-v1483-dispatch-once.yml

# Confined to this one disposable diagnostics branch, never main or production.
permissions:
  actions: write
  contents: read

concurrency:
  group: t58-v1483-dispatch-once
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'Boym323/AirRadar' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - name: Verify deployed release, run short diagnostic, then dispatch 60-minute soak
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const expected = { version: "1.0.483", commit: "f19d457b" };
            const response = await fetch("https://airradar.pomykal.cz/api/version", {
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error("Production version endpoint returned HTTP " + response.status);
            const deployed = await response.json();
            if (deployed.version !== expected.version || deployed.commit !== expected.commit ||
                deployed.channel !== "production") {
              throw new Error("Unexpected deployed version; refusing T58 dispatch: " +
                JSON.stringify({version: deployed.version, commit: deployed.commit, channel: deployed.channel}));
            }
            core.info("Verified production v1.0.483 / f19d457b");

            const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const workflowRuns = async (workflow_id) => {
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id, branch: "main", event: "workflow_dispatch", per_page: 30,
              });
              return response.data.workflow_runs;
            };
            async function dispatchAndFind(workflow_id, inputs) {
              const before = new Set((await workflowRuns(workflow_id)).map((run) => run.id));
              const params = { owner, repo, workflow_id, ref: "main" };
              if (inputs) params.inputs = inputs;
              await github.rest.actions.createWorkflowDispatch(params);
              for (let i = 0; i < 30; i += 1) {
                await pause(3000);
                const run = (await workflowRuns(workflow_id)).find((item) => !before.has(item.id));
                if (run) return run;
              }
              throw new Error("Workflow was dispatched, but its new run ID was not discovered: " + workflow_id);
            }

            const short = await dispatchAndFind("t58-cpu-spike-diagnosis.yml", {duration: "600"});
            core.notice("10-minute read-only diagnostic: " + short.html_url);
            await core.summary.addRaw("Short T58 (600 seconds): " + short.html_url + "\n\n").write();

            let completed;
            for (let i = 0; i < 100; i += 1) {
              const { data: run } = await github.rest.actions.getWorkflowRun({owner,repo,run_id:short.id});
              if (run.status === "completed") { completed = run; break; }
              await pause(10000);
            }
            if (!completed) throw new Error("Short diagnostic did not complete within polling budget: " + short.html_url);
            if (completed.conclusion !== "success") {
              throw new Error("Short diagnostic workflow did not succeed (" + completed.conclusion + "): " + short.html_url);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {owner,repo,run_id:short.id,per_page:100});
            const observe = jobs.find((j) => j.name === "Collect read-only CPU/cgroup/GC evidence");
            if (!observe || observe.conclusion !== "success") {
              throw new Error("Short diagnostic has no successful production observation job: " + short.html_url);
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:short.id});
            if (!artifacts.data.artifacts.some((a) => a.name.startsWith("t58-cpu-spikes-") && !a.expired)) {
              throw new Error("Short diagnostic finished but sanitized report artifact is unavailable: " + short.html_url);
            }

            core.notice("Short T58 passed, including sanitised report; dispatching hourly soak.");
            const hour = await dispatchAndFind("t58-production-soak.yml");
            core.notice("60-minute read-only production soak: " + hour.html_url);
            await core.summary.addRaw("Short T58 PASS, sanitized artifact confirmed.\n\nHourly T58: " +
              hour.html_url + "\n").write();
