name: Temporary Airspace Map UI Patch

on:
  push:
    branches:
      - feature/airspace-activity-map
    paths:
      - scripts/patch-airspace-activity-map-ui.mjs
      - .github/workflows/temporary-airspace-map-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/airspace-activity-map
          fetch-depth: 0
      - name: Apply checked UI patch
        run: node scripts/patch-airspace-activity-map-ui.mjs
      - name: Commit patched map component
        run: |
          if git diff --quiet -- components/airradar-app.tsx; then
            echo "No UI patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/airradar-app.tsx
          git commit -m "feat: visualize planned airspace activity on radar map"
          git push origin HEAD:feature/airspace-activity-map
