name: Operational Twin validation benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/twin-fusion-benchmark.yml'
      - 'scripts/benchmark-operational-twin-t57.ts'
      - 'tests/operational-twin-t57-replay.test.ts'
      - 'lib/operational-twin/**'
      - 'lib/server/operational-twin.ts'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Representative (fast) or full matrix'
        type: choice
        options: [representative, matrix]
        default: representative
        required: true
  schedule:
    - cron: '35 3 * * 0'

permissions:
  contents: read

concurrency:
  group: operational-twin-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Twin T57 semantic parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RADAR_TWIN_T57_PROFILE: ${{ github.event.inputs.profile || 'representative' }}
      AIRRADAR_ATC_RESOLUTION_ENABLED: 'false'
      AIRRADAR_ATC_SHADOW_PREDICTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Generate Prisma contract for imported server modules
        run: npm run prisma:generate
      - name: Verify Twin replay regressions
        run: npm run test:targeted -- tests/operational-twin-t57-replay.test.ts tests/feature-retirement-e.test.ts
      - name: Measure T57 canonical validator parity
        run: npm run benchmark:twin-t57 > "$RUNNER_TEMP/twin-t57-result.json"
      - name: Preserve measurement artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-twin-t57-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/twin-t57-result.json
          if-no-files-found: warn
          retention-days: 90
